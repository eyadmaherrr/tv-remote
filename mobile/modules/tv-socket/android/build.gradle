plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tvsocket'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.tvsocket"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same OkHttp React Native ships with.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
